# Install Docker and Docker Compose.

- name: Update apt package
  apt:
    update_cache: yes # Instructs Ansible’s apt module to refresh the caches before applying the necessary changes.
    cache_valid_time: 3600 # Update the apt cache if it is older than the cache_valid_time.
  tags: update-apt

- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - gnupg
      - lsb-release
    state: present
  tags: docker

- name: Add Docker GPG apt Key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: docker

- name: Add Docker Repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable"
    state: present
    filename: docker # Create repo file at /etc/apt/sources.list.d/docker.list
  tags: docker

- name: Update apt package index again after adding Docker repo
  apt:
    update_cache: yes
  tags: docker

- name: Install Docker CE and dependencies
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
  tags: docker

- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: yes
    state: started
  tags: docker

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: yes
  tags: docker

- name: Create common network for Docker
  docker_network:
    name: common_network
    driver: bridge
    state: present
  tags: docker